[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "i2pr-sam"
version = "0.1.0"
requires-python = ">=3.9"
description = "Python bindings for the i2pr-sam client"

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "i2pr_sam"
features = ["python-extension"]
