[package]
name = "i2pr-sam"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Async Rust client for I2P SAM bridges"

[dependencies]
i2pr-sam-proto = { path = "../i2pr-sam-proto" }
tokio = { version = "1", features = ["io-util", "net", "rt", "rt-multi-thread", "sync", "time", "macros"] }
thiserror = "2"
base64 = "0.22"
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
